<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Movie Watchlist</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.css">
	<link rel="stylesheet" href="assets/css/reset.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/cards.css">
</head>

<!-- TODO: Move the actual HTML to be generated within the index.html page -->

<body id="watchlist-page">
	<div class="body-wrapper">
		<nav class="nav-bar">
			<div class="nav-wrapper">
				<a href="index.html">
					search
				</a>
				<a href="watchlist.html" class="current-page">
					watchlist
				</a>
			</div>
		</nav>
		<header>
			<div class="header-text-wrapper">
				<h1>WATCHLIST</h1>
				<!-- Removing form until i decide what kind of handling it should have on the watchlist page -->
				<div id="sort-wrapper">
					<label for="sort-select">Sort by:</label>
					<select id="sort-select" name="sort-select">
						<option value="title">Title (A&ndash;Z)</option>
						<option value="year">Year (Newest&ndash;Oldest)</option>
						<option value="rating">Rating (Highest&ndash;Lowest)</option>
					</select>
				</div>
				<div id="filter-wrapper">
					<label for="genre-filter-select">Filter by genre:</label>
					<!-- options are populated in JS from the current watchlist -->
					<select id="genre-filter-select" name="genre-filter-select">
						<option value="all">All Genres</option>
					</select>
				</div>
			</div>
		</header>
		<main id="main" class="main space-saver">
			<div id="main-wrapper"></div>
		</main>
	</div>
	<script src="index.js" type="module"></script>
	<script src="assets/vanilla-tilt.js" type="text/javascript"></script>
</body>
